<!DOCTYPE html>
<html>
  <head>
    <title>10d</title>
    <style>
      .toggle-button{
        background-color: black;
        color:white;
        height: 30px;
        width: 80px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .is-toggled{
        background-color: grey;
        color: white;
      }
    </style>
  </head>
  <body>
    <button class="toggle-button js-button"
    onclick="
    const button = document.querySelector('.js-button');
    if(!button.classList.contains('is-toggled')){
      button.classList.add('is-toggled');
    }else{
      button.classList.remove('is-toggled');
    }
    ">
      Gaming
    </button>
  </body>
</html>

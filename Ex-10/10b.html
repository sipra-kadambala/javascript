<!DOCTYPE html>
<html>
  <head>
    <title>10a</title>
    <style>
      body{
        font-family: Arial;
      }
      .request-button{
        background-color: black;
        color: white;
        border: none;
        height: 32px;
        width: 100px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
      }

      .schedule-button{
        background-color: rgb(230,230,230);
        color: black;
        border: none;
        height: 32px;
        width: 140px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <button class="request-button">
      Request now
    </button>

    <button class="schedule-button">
      Schedule for later
    </button>
  </body>
</html>

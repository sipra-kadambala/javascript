<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="10j.css">
  </head>
  <body>

    <p class="js-calculation"></p>

    <p>
    <button class="calculate-button grey-button" onclick="
    updateCalculation('1');
    ">
      1
    </button>
    <button class="calculate-button grey-button"  onclick="
    updateCalculation('2');
    ">
      2
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('3');
    ">
      3
    </button>

    <button class="calculate-button orange-button"  onclick="
    updateCalculation('+');
    ">
      +
    </button>
    </p>

    <p>
      <button class="calculate-button grey-button"  onclick="
    updateCalculation('4');
    ">
      4
    </button>
    <button class="calculate-button grey-button"  onclick="
    updateCalculation('5');
    ">
      5
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('6');
    ">
      6
    </button>
    <button class="calculate-button orange-button"  onclick="
    updateCalculation('-');
    ">
      -
    </button>
    </p>
    <p>
      <button class="calculate-button grey-button"  onclick="
    updateCalculation('7');
    ">
      7
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('8');
    ">
      8
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('9');
    ">
      9
    </button>
    <button class="calculate-button orange-button"  onclick="
    updateCalculation('*');
    ">
      *
    </button>
    </p>
    <p>
     <button class="calculate-button grey-button"  onclick="
    updateCalculation('*');
    ">
      0
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('.');
    ">
      .
    </button>

    <button class="calculate-button grey-button"  onclick="
    calculation=eval(calculation);
    displayElement();
    localStorage.setItem('calculation',calculation);
    ">
      =
    </button>

    <button class="calculate-button orange-button"  onclick="
    updateCalculation('/');
    ">
      /
    </button>
    </p>

    <button class="calculate-button clear-button"  onclick="
    calculation='';
    displayElement();
    ">
      Clear
    </button>

    <script src="10j.js">
     
    </script>
  </body>
</html>

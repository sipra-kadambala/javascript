<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <style>
      body{
        font-family: Arial;
        background-color: black;
        color: white;
      }
      .calculate-button{
        border: none;
        height: 60px;
        width: 60px;
        border-radius: 30px;
        font-size: 26px;
        cursor: pointer;
      }
      .grey-button{
        background-color: rgb(51,51,51);
        color: white;
      }
      .orange-button{
        background-color: rgb(254, 160, 10);
        color: white;
      }
      .clear-button{
        background-color: rgb(51,51,51);
        color: white;
        font-size: 17px;
      }
    </style>
  </head>
  <body>

    <p class="js-calculation"></p>

    <p>
    <button class="calculate-button grey-button" onclick="
    updateCalculation('1');
    ">
      1
    </button>
    <button class="calculate-button grey-button"  onclick="
    updateCalculation('2');
    ">
      2
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('3');
    ">
      3
    </button>

    <button class="calculate-button orange-button"  onclick="
    updateCalculation('+');
    ">
      +
    </button>
    </p>

    <p>
      <button class="calculate-button grey-button"  onclick="
    updateCalculation('4');
    ">
      4
    </button>
    <button class="calculate-button grey-button"  onclick="
    updateCalculation('5');
    ">
      5
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('6');
    ">
      6
    </button>
    <button class="calculate-button orange-button"  onclick="
    updateCalculation('-');
    ">
      -
    </button>
    </p>
    <p>
      <button class="calculate-button grey-button"  onclick="
    updateCalculation('7');
    ">
      7
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('8');
    ">
      8
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('9');
    ">
      9
    </button>
    <button class="calculate-button orange-button"  onclick="
    updateCalculation('*');
    ">
      *
    </button>
    </p>
    <p>
     <button class="calculate-button grey-button"  onclick="
    updateCalculation('*');
    ">
      0
    </button>

    <button class="calculate-button grey-button"  onclick="
    updateCalculation('.');
    ">
      .
    </button>

    <button class="calculate-button grey-button"  onclick="
    calculation=eval(calculation);
    displayElement();
    localStorage.setItem('calculation',calculation);
    ">
      =
    </button>

    <button class="calculate-button orange-button"  onclick="
    updateCalculation('/');
    ">
      /
    </button>
    </p>

    <button class="calculate-button clear-button"  onclick="
    calculation='';
    displayElement();
    ">
      Clear
    </button>

    <script>
      let calculation=localStorage.getItem('calculation')|| '';
      displayElement();
      function updateCalculation(num){
        calculation += num;
        displayElement();
        localStorage.setItem('calculation',calculation);
      }

      function displayElement(){
        document.querySelector('.js-calculation').innerHTML = calculation;
      }
    </script>
  </body>
</html>

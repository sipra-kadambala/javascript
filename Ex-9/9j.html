<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
  </head>
  <body>
    <p class="js-input"></p>

    <p>
    <button onclick="
    updateCalculation('1');
    ">
      1
    </button>
    <button onclick="
    updateCalculation('2');
    ">
      2
    </button>

    <button onclick="
    updateCalculation('3');
    ">
      3
    </button>
    <button onclick="
    updateCalculation('+');
    ">
      +
    </button>
    </p>
    <p>
      <button onclick="
    updateCalculation('4');
    ">
      4
    </button>
    <button onclick="
    updateCalculation('5');
    ">
      5
    </button>

    <button onclick="
    updateCalculation('6');
    ">
      6
    </button>
    <button onclick="
    updateCalculation('-');
    ">
      -
    </button>
    </p>
    <p>
      <button onclick="
    updateCalculation('7');
    ">
      7
    </button>
    <button onclick="
    updateCalculation('8');
    ">
      8
    </button>

    <button onclick="
    updateCalculation('9');
    ">
      9
    </button>
    <button onclick="
    updateCalculation('*');
    ">
      *
    </button>
    </p>
    <p>
     <button onclick="
    updateCalculation('*');
    ">
      0
    </button>
    <button onclick="
    updateCalculation('.');
    ">
      .
    </button>

    <button onclick="
    calculation=eval(calculation);
    displayElement();
    localStorage.setItem('calculation',calculation);
    ">
      =
    </button>

    <button onclick="
    updateCalculation('/');
    ">
      /
    </button>
    </p>

    <button onclick="
    calculation='';
    displayElement();
    ">
      Clear
    </button>

    <script>
      let calculation=localStorage.getItem('calculation')|| '';
      displayElement();
      function updateCalculation(num){
        calculation += num;
        displayElement();
        localStorage.setItem('calculation',calculation);
      }

      function displayElement(){
        document.querySelector('.js-input').innerHTML = calculation;
      }
    </script>
  </body>
</html>

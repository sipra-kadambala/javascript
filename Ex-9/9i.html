<!DOCTYPE html>
<html>

<head>
  <title>9i</title>
</head>

<body>
  <p>
    Cart Quantity
  </p>

  <button onclick="
     console.log(`Cart quantity: ${cartQuantity}`);
    ">
    Show Quantity
  </button>

  <button onclick="
    updateCartQuantity(1);
    ">
    Add to Cart
  </button>

  <button onclick="
    updateCartQuantity(2);
    ">
    +2
  </button>

  <button onclick="
    updateCartQuantity(3);
    ">
    +3
  </button>

  <button onclick="
    updateCartQuantity(4);
    ">
    +4
  </button>


  <button onclick="
    updateCartQuantity(5);
    ">
    +5
  </button>

  <button onclick="
    console.log('Cart was reset');
    cartQuantity=0;
    displayQuantity();
    ">
    Reset Cart
  </button>


  <button onclick="
    updateCartQuantity(-1);
    ">
    Remove from cart
  </button>

  <button onclick="
    updateCartQuantity(-2);
    ">
    -2
  </button>

  <button onclick="
    updateCartQuantity(-3);
    ">
    -3
  </button>

  <p class="js-quantity"></p>

  <script>
    let cartQuantity = 0;

    displayQuantity();

    function updateCartQuantity(num) {
      if (cartQuantity + num > 10) {
        alert('The cart is full');
        return;
      }
      if(cartQuantity + num < 0){
        alert('Note enough items in the cart');
        return;
      }
        cartQuantity += num;
        displayQuantity();
      
    }

    function displayQuantity(){
      document.querySelector('.js-quantity').innerHTML = `Cart quantity: ${cartQuantity}`;
    }
  </script>
</body>

</html>

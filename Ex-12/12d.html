<!DOCTYPE html>
<html>
  <head>
    <title>12c</title>
  </head>
  <body>
    <button class="button-start" onclick="updateButton();
      ">
      Start
    </button>
    <script>
      function updateButton(){
        const button = document.querySelector('.button-start');
        button.innerHTML = 'Loading...';
        setTimeout(function(){
          button.innerHTML = 'Finished!';
        },1000);
      }
    </script>
  </body>
</html>

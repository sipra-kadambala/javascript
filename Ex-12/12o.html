<!DOCTYPE html>
<html>
  <head>
    <title>12o</title>
  </head>
  <body>
    <script>
      function removeEgg(foods){
        let eggCount=0;
         return foods.filter((food) => {
          if(food === 'egg' && eggCount<2){
            eggCount++;
            return false;
          }
            return true;
          
        });
      };

      console.log(removeEgg(['egg','apple','egg','egg','ham']));
    </script>
  </body>
</html>

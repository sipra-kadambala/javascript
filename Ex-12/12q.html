<!DOCTYPE html>
<html>
  <head>
    <title>12c</title>
  </head>
  <body>
    <button class="button-start js-start-button">
      Start
    </button>
    <script>
      document.querySelector('.js-start-button').addEventListener('click', () =>{
        updateButton();
      });
      function updateButton(){
        const button = document.querySelector('.button-start');
        setTimeout(function(){
          button.innerHTML = 'Finished';
        },1000);
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>6i</title>
  </head>
  <body>
    <script>
     const randomNumber = Math.random();
     let result;
     let guess='heads';
     if(randomNumber<0.5){
      result='heads';
     }
     else{
      result='tails';
     }

     if(result === guess){
      console.log('You win!');
     }
     else{
      console.log('You lose!');
     }
    </script>
  </body>
</html>

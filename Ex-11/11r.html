<!DOCTYPE html>
<html>

<head></head>

<body>
  <script>


    function removeEgg(food) {
      const result = [];
      for (let i = 0; i < food.length; i++) {
        if (food[i] === 'egg') {
          continue;
        }

        result.push(food[i]);
      }
      return result;
    }

    console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']));

  </script>
</body>

</html>

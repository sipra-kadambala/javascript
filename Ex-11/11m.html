<!DOCTYPE html>
<html>
  <head>
    <title>11m</title>
  </head>
  <body>
    <script>
      function minMax(nums){
        const obj = {
          min: null,
          max: null
        };

        for(let i=0;i<nums.length;i++){
          let value = nums[i];

          if(obj.max === null ||value < obj.max){
            obj.max = value;
          }

          if( obj.min === null||value > obj.min){
            obj.min = value;
          }

        }
        return obj;
      }

      console.log(minMax([1,-3,5]));
      console.log(minMax([-2,3,-5,7,10]));
      console.log(minMax([]));
      console.log(minMax([3]));
    </script>
  </body>
</html>

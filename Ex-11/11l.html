<!DOCTYPE html>
<html>
  <head>
    <title>11h</title>
  </head>
  <body>
    <script>
      function minMax(nums){
        const obj = {
          min: nums[0],
          max: nums[0]
        };

        for(let i=0;i<nums.length;i++){
          let value = nums[i];

          if(value < obj.max){
            obj.max = value;
          }

          if(value > obj.min){
            obj.min = value;
          }
        }
        return obj;
      }

      console.log(minMax([1,-3,5]));
      console.log(minMax([-2,3,-5,7,10]));
    </script>
  </body>
</html>
